<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NOVA — Nova palavra-passe</title><link rel="stylesheet" href="./login.css"></head><body><div class="ambient" aria-hidden="true"><div class="grid"></div></div><div class="cosmos-stage" aria-hidden="true"><div class="cosmic-nebula"></div><div class="starfield stars-one"></div><div class="starfield stars-two"></div><div class="cosmic-turntable"><div class="cosmic-sweep"></div><div class="planet-halo"></div><div class="cosmic-planet"><span class="planet-texture"></span></div></div></div><header class="topbar"><div class="brand-mark">N</div><span class="brand-name">NOVA</span></header><main class="shell"><section class="intro"><div class="eyebrow">O teu próximo capítulo começa aqui</div><h1>Recupera o teu<br><span class="gradient-text">próprio espaço.</span></h1><p class="lead">Escolhe uma nova palavra-passe para a tua conta NOVA.</p></section><section class="auth-wrap"><div class="auth-card"><div class="card-head"><p class="welcome">SEGURANÇA DA CONTA</p><h2>Nova palavra-passe.</h2><p class="card-sub">Introduz e confirma a tua nova palavra-passe.</p></div><div class="notice" id="notice" role="status" aria-live="polite"></div><form id="resetForm"><div class="field"><div class="field-top"><label for="newPassword">Palavra-passe</label></div><div class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo de 8 caracteres" required></div></div><div class="field"><div class="field-top"><label for="confirmPassword">Confirmar palavra-passe</label></div><div class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" required placeholder="Repete a palavra-passe"></div></div><button class="primary" id="saveButton" type="submit">Guardar nova palavra-passe</button></form><p class="signup"><a href="./login.html">Voltar ao login</a></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const client = window.supabase?.createClient(window.NOVA_SUPABASE_URL, window.NOVA_SUPABASE_KEY);
try { document.body.classList.toggle('light', localStorage.getItem('nova-theme') === 'light'); } catch (_) {}
const notice = document.getElementById('notice');
const show = (msg, success = false) => { notice.textContent = msg; notice.className = 'notice show' + (success ? ' success' : ''); };
if (!client) show('Não foi possível carregar a ligação ao Supabase.');
let recoveryReady = false;
client?.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') { recoveryReady = true; show('Link validado. Podes definir a nova palavra-passe.', true); } });
client?.auth.getSession().then(({data}) => { if (data.session) recoveryReady = true; });
document.getElementById('resetForm').addEventListener('submit', async e => {
 e.preventDefault();
 const pass = document.getElementById('newPassword').value;
 if (pass.length < 8) return show('A palavra-passe deve ter pelo menos 8 caracteres.');
 if (pass !== document.getElementById('confirmPassword').value) return show('As palavras-passe não coincidem.');
 if (!client || !recoveryReady) return show('O link de recuperação ainda não foi validado. Abre novamente o link recebido por email.');
 const btn = document.getElementById('saveButton'); btn.disabled = true;
 try { const {error} = await client.auth.updateUser({password: pass}); if(error) throw error; show('Palavra-passe alterada com sucesso. Já podes iniciar sessão.', true); }
 catch(error) { show('Não foi possível alterar a palavra-passe: ' + error.message); }
 finally { btn.disabled = false; }
});
</script></body></html>
