<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVA — A tua área</title>
  <link rel="stylesheet" href="./login.css">
  <style>
    .private-layout { position:relative; z-index:10; max-width:1040px; margin:0 auto; padding:120px 24px 60px; }
    .private-card { background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:26px; padding:clamp(28px,5vw,56px); backdrop-filter:blur(22px); }
    .private-label { color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    .private-card h1 { font-size:clamp(32px,5vw,54px); margin:12px 0; letter-spacing:-.045em; }
    .private-card p { color:var(--muted); line-height:1.8; }
    .private-actions {display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-top:26px;}
    .private-actions button {cursor:pointer; padding:14px 22px; border-radius:14px; font-weight:700; background:linear-gradient(120deg,#8864ed,#6781f5); border:0; color:white;}
    .private-actions .secondary {background:var(--field);border:1px solid var(--line);color:var(--text)}
    #accountEmail {overflow-wrap:anywhere;color:var(--text)}
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="grid"></div></div>
  <header class="topbar" aria-label="NOVA"><div class="brand-mark">N</div><span class="brand-name">NOVA</span></header>
  <main class="private-layout" id="privateArea" hidden>
    <section class="private-card">
      <div class="private-label">NOVA LIFE · Área privada</div>
      <h1 id="greeting">Bem-vindo à NOVA!</h1>
      <p>A tua conta está ligada ao Supabase. Esta é uma página temporária para testar o registo e a autenticação. O Dashboard NOVA Life será desenvolvido a seguir.</p>
      <p>Conta: <strong id="accountEmail"></strong></p>
      <div class="private-actions"><button id="logout" type="button">Terminar sessão</button><button class="secondary" id="theme" type="button">Alternar modo claro/escuro</button></div>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <main class="private-layout" id="loadingArea"><p>A confirmar a sessão...</p></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    const client = window.supabase?.createClient(window.NOVA_SUPABASE_URL, window.NOVA_SUPABASE_KEY);
    const refreshTheme = () => { try {document.body.classList.toggle('light', localStorage.getItem('nova-theme') === 'light');} catch (_) {} };
    refreshTheme();
    document.getElementById('theme').addEventListener('click', () => {
      const next = !document.body.classList.contains('light');
      document.body.classList.toggle('light', next);
      try {localStorage.setItem('nova-theme', next ? 'light' : 'dark');} catch (_) {}
    });
    async function initialize() {
      if (!client) { document.getElementById('loadingArea').textContent = 'Não foi possível ligar ao Supabase.'; return; }
      try {
        const {data, error} = await client.auth.getUser();
        if (error || !data.user) { window.location.replace('./login.html'); return; }
        document.getElementById('accountEmail').textContent = data.user.email || 'Email indisponível';
        const name = data.user.user_metadata?.full_name;
        if (name) document.getElementById('greeting').textContent = `Olá, ${name}!`;
        document.getElementById('loadingArea').hidden = true;
        document.getElementById('privateArea').hidden = false;
      } catch (_) { document.getElementById('loadingArea').textContent = 'Erro de ligação. Verifica a internet e atualiza a página.'; }
    }
    document.getElementById('logout').addEventListener('click', async () => {
      const btn = document.getElementById('logout'); btn.disabled = true;
      const {error} = await client.auth.signOut();
      if (error) { document.getElementById('message').textContent = 'Não foi possível terminar sessão: ' + error.message; btn.disabled = false; return; }
      window.location.replace('./login.html');
    });
    initialize();
  </script>
</body>
</html>
